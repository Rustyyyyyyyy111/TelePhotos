name: Build Tele Photos APK

on: [push]

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Setup JDK
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
  - name: Build Tele Photos
    run: |
      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon
      elif [ -f "./android/gradlew" ]; then
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug --no-daemon
      else
        echo "ERROR: Cannot find Gradle wrapper"
        exit 1
      fi
  - name: Upload Tele Photos APK
    uses: actions/upload-artifact@v4
    with:
      name: Tele-Photos-APK
      path: |
        **/build/outputs/apk/debug/*.apk
      if-no-files-found: error
