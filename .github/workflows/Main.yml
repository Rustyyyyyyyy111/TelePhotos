name: Build Android APK

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4
  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
  - name: Locate Android project
    shell: bash
    run: |
      if [ -f "./gradlew" ]; then
        echo "GRADLE_DIR=." >> "$GITHUB_ENV"
      elif [ -f "./android/gradlew" ]; then
        echo "GRADLE_DIR=android" >> "$GITHUB_ENV"
      else
        echo "::error::Cannot find gradlew in root or android folder."
        exit 1
      fi
  - name: Build Debug APK
    shell: bash
    run: |
      cd "$GRADLE_DIR"
      chmod +x ./gradlew
      ./gradlew assembleDebug --no-daemon --stacktrace
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: TeleAnh-Debug-APK
      path: |
        **/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
