name: Build Android APK

on:
push:
branches: [ main, master ]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4
  - name: Set up JDK 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'
  - name: Locate Android project
    run: |
      if [ -d "android" ] && [ -f "android/gradlew" ]; then
        echo "PROJECT_DIR=android" >> "$GITHUB_ENV"
      elif [ -f "gradlew" ]; then
        echo "PROJECT_DIR=." >> "$GITHUB_ENV"
      else
        echo "Không tìm thấy Gradle Wrapper!"
        exit 1
      fi
  - name: Remove unused Google Services plugin
    run: |
      echo "Checking Google Services configuration..."
      grep -RInE \
        --include='*.gradle' \
        --include='*.gradle.kts' \
        'com\.google\.gms\.google-services' . \
        --exclude-dir=.git \
        --exclude-dir=build || true
      echo "Google Services must be removed from the project Gradle configuration if Firebase is not used."
  - name: Prepare debug keystore
    run: |
      if [ ! -f "debug.keystore" ]; then
        keytool -genkeypair \
          -v \
          -keystore debug.keystore \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
      fi
  - name: Build APK with Gradle
    run: |
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew clean assembleDebug \
        --no-daemon \
        --stacktrace
  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: TeleAnh-Debug-APK
      path: |
        **/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
