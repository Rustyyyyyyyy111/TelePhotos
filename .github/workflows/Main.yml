name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Remove Google Services & prepare keystore
        run: |
          # Xác định thư mục gốc chứa Gradle project
          PROJECT_DIR="."
          if [ -d "android" ] && ([ -f "android/build.gradle" ] || [ -f "android/build.gradle.kts" ] || [ -f "android/settings.gradle" ] || [ -f "android/settings.gradle.kts" ]); then
            PROJECT_DIR="android"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          # Xóa google-services.json nếu có và gỡ plugin google-services khỏi file Gradle trên runner
          rm -f "$PROJECT_DIR/app/google-services.json"
          find "$PROJECT_DIR" -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" \) -type f | while read -r f; do
            sed -i '/com\.google\.gms\.google-services/d' "$f"
            sed -i '/google-services/d' "$f"
          done

          # Tạo file debug.keystore để ký ứng dụng
          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            echo "Đang tạo file debug.keystore..."
            keytool -genkey -v -keystore "$PROJECT_DIR/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK with Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug -x processDebugGoogleServices -Pksp.incremental=false --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
